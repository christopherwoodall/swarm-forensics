[schedule]
# Hunts are discrete human-triggered jobs. These intervals are kept for
# the UI's planning display only; nothing here schedules future work.
scan_interval_hours = 24
research_interval_hours = 168
predict_interval_hours = 24
update_interval_hours = 24

[sources]
urlquery_enabled = true
cdx_enabled = true
arquivo_enabled = true
request_delay_seconds = 5
max_results_per_query = 50
max_terms_per_sweep = 200
urlquery_budget = 60
cdx_budget = 60
arquivo_budget = 60
user_agent = tracehound/0.1 (+https://github.com/christopherwoodall/swarm-forensics)

[ioc]
auto_propose = false
require_review_for_promote = true

[research]
watch_urls =
    https://transluce.org/
novelty_min_chars = 4

[safety]
paused = false
private_mode = true
firewall_mode = advisory
alert_on_claim_level = L3

[paths]
state_dir = state
