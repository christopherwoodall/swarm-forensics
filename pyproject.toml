[project]
name = "swarm-forensics"
version = "0.1.0"
description = "Multi-agent forensics engine for AI swarm timelines and coordination anomalies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.0",
    "jsonschema>=4.18",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_forensics"]

[tool.ruff]
line-length = 100
src = ["src"]
