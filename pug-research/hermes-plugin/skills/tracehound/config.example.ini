# tracehound config example.
# Copy to config.ini before first use. Every key here has a comment.
# There is no schedule section. Hunts are human-triggered only
# (hunting-dog model). Nothing runs while the app is closed.

[safety]
# paused: true blocks every hunt (CLI, chat, and API).
paused = false
# private_mode: true renders watch-term strings as bullets in the UI.
# Reveal happens on click only. Keep this true.
private_mode = true
# firewall_mode: the prompt firewall is advisory-only and LOCKED.
# The validator accepts "off" or "advisory" only. "enforcing" is
# refused in code: the judge has not passed the injection-resistance
# evaluation (ADVERSARIAL.md objection #5). The judge only recommends;
# the human hunter decides every promotion.
firewall_mode = advisory
# alert_on_claim_level: toasts fire for hits at or above this level.
# Claim levels are L1 (weakest) through L5 (strongest). L3 is default.
alert_on_claim_level = L3
# exclusion_terms: terms the updater never proposes, comma separated.
# Banned terms stay banned even when auto_propose is on.
# Note: set this key here or via PUT /settings. The `modify` command
# rejects it today (missing from its schema); that gap needs a code fix.
exclusion_terms =

[hunt]
# Human-triggered hunt defaults. Every hunt is a discrete job the
# human starts, watches, and can cancel. No scheduling happens here.
# default_sources: sources used when a hunt names none.
default_sources = urlquery,cdx,arquivo
# default_cap: max watch terms per hunt unless --cap overrides it.
default_cap = 200
# request_delay_seconds: pause between HTTP requests. Be polite:
# urlquery is a free community service. Minimum 1.
request_delay_seconds = 5
# max_results_per_query: rows kept per source query. Minimum 1.
max_results_per_query = 50
# max_terms_per_sweep: hard ceiling on terms per hunt. Minimum 1.
max_terms_per_sweep = 200
# urlquery_budget / cdx_budget / arquivo_budget: query budget per
# source per hunt. The hunt stops at the budget even if terms remain.
urlquery_budget = 60
cdx_budget = 60
arquivo_budget = 60
# user_agent: contact User-Agent for every request. It MUST include a
# contact string (email or URL) so source operators can reach the hunter.
user_agent = tracehound/0.1 (+https://github.com/christopherwoodall/swarm-forensics)
# SCHEMA NOTE: the `modify` command validates these network keys under
# the sources.* names (settings.py SCHEMA), not hunt.*. This file is the
# documented home; a code change must move the reads and the schema to
# match. Until then, edit this file directly for these keys.

[ioc]
# auto_propose: false means update-iocs only proposes when the human
# runs it. Proposals enter the review queue as quarantined. Nothing
# promotes without an explicit human accept (GUI click or CLI decision).
auto_propose = false
# require_review_for_promote: true keeps promotion human-gated.
require_review_for_promote = true

[research]
# watch_urls: researcher publication pages, one per line. The human
# runs `tracehound research` to check them once. No auto-check exists.
watch_urls =
    https://transluce.org/
# novelty_min_chars: minimum token length for proposed terms. Minimum 1.
novelty_min_chars = 4

[chat]
# model_enabled: false keeps the rule-based responder (zero model calls).
# model_endpoint: optional endpoint for the model path. When set and
# enabled, the model only rephrases replies. Actions stay rule-based.
# model_api_key_env: name of the environment variable holding the key.
# The key never lives in config and never appears in logs.
# Note: these keys are read from this file only. `modify` rejects them.
model_enabled = false
model_endpoint =
model_api_key_env =

[paths]
# state_dir: working state (hits, jobs, review queue, IOC list).
# Relative paths resolve under the skill directory.
state_dir = state
